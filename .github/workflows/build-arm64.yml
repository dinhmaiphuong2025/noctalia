name: build-arm64

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build noctalia (arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            meson g++ just ninja-build \
            libwayland-dev wayland-protocols \
            libegl-dev libgles-dev \
            libfreetype-dev libfontconfig-dev \
            libcairo2-dev libpango1.0-dev libharfbuzz-dev \
            libxkbcommon-dev libglib2.0-dev \
            libsecret-1-dev libsodium-dev \
            libsdbus-c++-dev libpipewire-0.3-dev \
            libspa-0.2-dev \
            libpam0g-dev libpolkit-agent-1-dev libpolkit-gobject-1-dev \
            libwebp-dev libjxl-dev libsndfile1-dev librsvg2-dev \
            libqalculate-dev libxml2-dev \
            libmd4c-dev libtomlplusplus-dev libical-dev \
            nlohmann-json3-dev libstb-dev libjemalloc-dev \
            git pkg-config python3 python3-pip \
            libglib2.0-dev

      - name: Build & install wireplumber 0.5
        run: |
          git clone --depth 1 --branch 0.5.10 https://gitlab.freedesktop.org/pipewire/wireplumber.git /tmp/wireplumber
          cd /tmp/wireplumber
          meson setup build --prefix=/usr
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          pkg-config --modversion wireplumber-0.5

      - name: Setup meson
        run: meson setup build --prefix=/usr --buildtype=release

      - name: Build
        run: ninja -C build

      - name: Install to staging
        run: DESTDIR=$(pwd)/install ninja -C build install

      - name: Create artifact
        run: |
          cd $(pwd)/install
          tar czf ../noctalia-arm64.tar.gz .
          cd ..
          ls -lh noctalia-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: noctalia-arm64
          path: noctalia-arm64.tar.gz
          if-no-files-found: error
