name: build-arm64

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build noctalia (${{ matrix.distro }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu26
            image: ubuntu:26.04
            pkg_mgr: apt
          - distro: debian13
            image: debian:trixie
            pkg_mgr: apt
          - distro: fedora44
            image: fedora:44
            pkg_mgr: dnf
          - distro: arch
            image: archlinux:latest
            pkg_mgr: pacman
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (APT)
        if: matrix.pkg_mgr == 'apt'
        run: |
          apt-get update -y
          apt-get install -y \
            meson g++ just ninja-build \
            libwayland-dev libwayland-bin wayland-protocols \
            libegl-dev libgles-dev \
            libfreetype-dev libfontconfig-dev \
            libcairo2-dev libpango1.0-dev libharfbuzz-dev \
            libxkbcommon-dev libglib2.0-dev \
            libsecret-1-dev libsodium-dev libsystemd-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libpam0g-dev libpolkit-agent-1-dev libpolkit-gobject-1-dev \
            libwebp-dev libjxl-dev libsndfile1-dev librsvg2-dev \
            libqalculate-dev libxml2-dev libcurl4-gnutls-dev \
            libmd4c-dev libtomlplusplus-dev libical-dev \
            nlohmann-json3-dev libstb-dev libjemalloc-dev \
            git pkg-config python3 python3-pip cmake ca-certificates \
            curl gh

      - name: Install dependencies (DNF)
        if: matrix.pkg_mgr == 'dnf'
        run: |
          dnf install -y \
            meson gcc-c++ just ninja-build \
            wayland-devel wayland-protocols-devel \
            libEGL-devel mesa-libGLES-devel \
            freetype-devel fontconfig-devel \
            cairo-devel pango-devel harfbuzz-devel \
            libxkbcommon-devel glib2-devel \
            libsecret-devel libsodium-devel systemd-devel \
            pipewire-devel \
            pam-devel polkit-devel libcurl-devel \
            libwebp-devel libjxl-devel libsndfile-devel librsvg2-devel \
            libqalculate-devel libxml2-devel \
            md4c-devel tomlplusplus-devel libical-devel \
            json-devel stb_image_resize2-devel stb_image_write-devel \
            jemalloc-devel \
            git pkgconfig python3 cmake ca-certificates \
            curl gh

      - name: Install dependencies (PACMAN)
        if: matrix.pkg_mgr == 'pacman'
        run: |
          pacman -Sy --noconfirm --needed \
            meson gcc just ninja \
            wayland wayland-protocols libglvnd \
            freetype2 fontconfig \
            cairo pango harfbuzz \
            libxkbcommon glib2 \
            libsecret libsodium systemd-libs \
            pipewire \
            pam polkit curl \
            libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 \
            md4c tomlplusplus libical \
            nlohmann-json stb \
            jemalloc \
            git pkgconf python cmake ca-certificates \
            curl github-cli

      - name: Patch wl_proxy_get_display (removed in Wayland 1.22)
        run: |
          python3 -c "
          import re
          with open('src/wayland/virtual_keyboard_service.cpp', 'r') as f:
              content = f.read()
          pattern = r'\n\s+auto\* display = wl_proxy_get_display.*?\n\s+if \(display != nullptr\) \{\n\s+\(void\)wl_display_flush\(display\);\n\s+\}'
          content = re.sub(pattern, '', content, flags=re.DOTALL)
          with open('src/wayland/virtual_keyboard_service.cpp', 'w') as f:
              f.write(content)
          print('Patched virtual_keyboard_service.cpp')
          "

      - name: Upgrade wayland-protocols to 1.47
        run: |
          git clone --depth 1 --branch 1.47 https://gitlab.freedesktop.org/wayland/wayland-protocols.git /tmp/wayland-protocols
          cd /tmp/wayland-protocols
          meson setup build --prefix=/usr -Dtests=false
          ninja -C build install

      - name: Build & install wireplumber 0.5
        run: |
          git clone --depth 1 --branch 0.5.10 https://gitlab.freedesktop.org/pipewire/wireplumber.git /tmp/wireplumber
          cd /tmp/wireplumber
          meson setup build --prefix=/usr/local
          ninja -C build
          ninja -C build install
          ldconfig || true
          pkg-config --modversion wireplumber-0.5

      - name: Build & install sdbus-c++ v2.3.1
        run: |
          git clone --depth 1 --branch v2.3.1 https://github.com/Kistler-Group/sdbus-cpp.git /tmp/sdbus-cpp
          cd /tmp/sdbus-cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j$(nproc)
          cmake --install build
          ldconfig || true

      - name: Install stb headers
        run: |
          mkdir -p /usr/include/stb
          curl -L -o /usr/include/stb/stb_image_resize2.h https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize2.h
          curl -L -o /usr/include/stb/stb_image_write.h https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h
          curl -L -o /usr/include/stb/stb_image.h https://raw.githubusercontent.com/nothings/stb/master/stb_image.h

      - name: Setup meson
        run: meson setup build --prefix=/usr/local --buildtype=release -Dcpp_link_args="-Wl,-rpath,/usr/local/lib"

      - name: Build
        run: ninja -C build

      - name: Install to staging
        run: |
          DESTDIR=$(pwd)/install ninja -C build install
          mkdir -p $(pwd)/install/usr/local/lib
          cp -a /usr/local/lib/libsdbus-c++* $(pwd)/install/usr/local/lib/ 2>/dev/null || cp -a /usr/local/lib64/libsdbus-c++* $(pwd)/install/usr/local/lib/ 2>/dev/null || true
          cp -a /usr/local/lib/libwireplumber* $(pwd)/install/usr/local/lib/ 2>/dev/null || cp -a /usr/local/lib64/libwireplumber* $(pwd)/install/usr/local/lib/ 2>/dev/null || true
          mkdir -p $(pwd)/install/usr/share
          cp -r $(pwd)/install/usr/local/share/noctalia $(pwd)/install/usr/share/ 2>/dev/null || true
          mkdir -p $(pwd)/install/usr/bin
          ln -sf /usr/local/bin/noctalia $(pwd)/install/usr/bin/noctalia

      - name: Create artifact
        run: |
          cd $(pwd)/install
          tar czf ../noctalia-${{ matrix.distro }}-arm64.tar.gz .
          cd ..
          ls -lh noctalia-${{ matrix.distro }}-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: noctalia-${{ matrix.distro }}-arm64
          path: noctalia-${{ matrix.distro }}-arm64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish rolling release
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          cp artifacts/*/*.tar.gz release_files/
          # Create noctalia-arm64.tar.gz as default/backward-compatible fallback (from ubuntu26)
          cp release_files/noctalia-ubuntu26-arm64.tar.gz release_files/noctalia-arm64.tar.gz
          ls -la release_files/

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete noctalia-arm64 --repo ${{ github.repository }} --yes 2>/dev/null || true
          git tag -d noctalia-arm64 2>/dev/null || true
          git push --delete origin noctalia-arm64 2>/dev/null || true
          gh release create noctalia-arm64 \
            --repo ${{ github.repository }} \
            --title "noctalia-arm64 (Rolling Multi-Distro)" \
            --notes "Rolling release artifacts compiled for Ubuntu 26, Debian 13, Fedora 44, and Arch ARM64 from $(git rev-parse --short HEAD)" \
            --latest=false \
            release_files/*.tar.gz

